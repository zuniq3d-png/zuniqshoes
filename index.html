<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZUNIQ SHOES | Future Footwear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-secondary: #121216;
            --bg-card: #18181f;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent: #00f0ff; /* Electric Blue */
            --accent-hover: #00c8d6;
            --accent-glow: rgba(0, 240, 255, 0.25);
            --border: #272732;
            --danger: #ff3b5c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-logo {
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.3s;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--accent);
        }

        .cart-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .cart-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .cart-count {
            background: var(--accent);
            color: #000;
            padding: 2px 7px;
            border-radius: 50%;
            font-size: 0.8rem;
        }

        /* Hero Section */
        .hero {
            margin-top: 70px;
            min-height: 85vh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            padding: 4rem 5%;
            background: radial-gradient(circle at 75% 50%, rgba(0, 240, 255, 0.08) 0%, transparent 50%);
            border-bottom: 1px solid var(--border);
        }

        .hero-content h1 {
            font-size: clamp(2.8rem, 5vw, 4.5rem);
            line-height: 1.05;
            margin-bottom: 1.5rem;
        }

        .hero-content h1 span {
            color: var(--accent);
            display: block;
        }

        .hero-content p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 480px;
            margin-bottom: 2.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 1rem 2.2rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 25px var(--accent-glow);
            transform: translateY(-2px);
        }

        .hero-image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-image-container img {
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            object-fit: cover;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
            transition: transform 0.5s ease;
        }

        .hero-image-container img:hover {
            transform: scale(1.03) rotate(-2deg);
        }

        /* Store Section */
        .store-section {
            padding: 5rem 5%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .section-header h2 {
            font-size: 2.2rem;
        }

        .filter-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active, .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 240, 255, 0.05);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 2rem;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            border-color: var(--accent);
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        .product-img-wrapper {
            position: relative;
            width: 100%;
            height: 280px;
            background: #101014;
            overflow: hidden;
        }

        .product-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.08);
        }

        .product-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(9, 9, 11, 0.85);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 3px 10px;
            font-size: 0.75rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            border-radius: 3px;
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-category {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .product-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .product-price {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        /* Size Selector */
        .size-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .size-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .size-btn.selected, .size-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: rgba(0, 240, 255, 0.15);
        }

        .add-to-cart-btn {
            margin-top: auto;
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.8rem;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .add-to-cart-btn:hover {
            background: var(--accent);
            color: #000;
        }

        /* Cart Drawer */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            justify-content: flex-end;
        }

        .cart-overlay.open {
            display: flex;
        }

        .cart-drawer {
            width: 100%;
            max-width: 420px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .close-cart:hover {
            color: var(--text-primary);
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            background: var(--bg-card);
            padding: 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            align-items: center;
        }

        .cart-item img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 4px;
        }

        .cart-item-details {
            flex-grow: 1;
        }

        .cart-item-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .cart-item-meta {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .cart-item-price {
            color: var(--accent);
            font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
        }

        .remove-item {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
        }

        .cart-footer {
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
            margin-top: 1rem;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
        }

        /* Checkout Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 300;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 2rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 0 40px var(--accent-glow);
        }

        .modal-box h3 {
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .form-group {
